name: Bug report
description: Something doesn't work the way it should
labels: ["type:bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        The smallest markdown input that triggers it, and the exact command you ran.
        A copy-pasteable example is the single most useful thing you can include here.
      placeholder: |
        Command: doctoc README.md

        Input file content:
        ## 1.1 My first header
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: doctoc version
      description: Output of `pip show doctoc`.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: A proposed fix, workaround, or related issue — totally optional, but very welcome.
    validations:
      required: false
