[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doctoc"
version = "1.1.1"
description = "Generate table of contents for Markdown files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [{ name = "Ktechhub", email = "mm@ktechhub.com" }]
keywords = ["markdown", "table of contents"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["click>=8.0", "requests>=2.28"]

[project.urls]
Homepage = "https://github.com/ktechhub/doctoc"

[project.scripts]
doctoc = "doctoc.cli:main"

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*", ".github*", "venv*"]
